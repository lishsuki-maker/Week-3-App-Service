name: Consumer-Workflow

on:
  push:
    branches: [dev, qa, uat, preprod, main]
  pull_request:
    branches: [main]

jobs:
  dockerfile-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile

  build-test:
    runs-on: ubuntu-latest
    needs: dockerfile-lint
    steps:
      - uses: actions/checkout@v4
      - name: Run build
        run: make build
      - name: Run test
        run: make test

  deploy-dev:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - name: Call reusable workflow
        uses: lishsuki-maker/gh-sharedrepo/.github/workflows/deploy.yml@main
        with:
          environment: dev
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}

  deploy-qa:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/qa'
    steps:
      - name: Call reusable workflow
        uses: lishsuki-maker/gh-sharedrepo/.github/workflows/deploy.yml@main
        with:
          environment: qa
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}

  deploy-uat:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/uat'
    steps:
      - name: Call reusable workflow
        uses: lishsuki-maker/gh-sharedrepo/.github/workflows/deploy.yml@main
        with:
          environment: uat
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}

  deploy-preprod:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/preprod'
    steps:
      - name: Call reusable workflow
        uses: lishsuki-maker/gh-sharedrepo/.github/workflows/deploy.yml@main
        with:
          environment: preprod
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}

  deploy-prod:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Call reusable workflow
        uses: lishsuki-maker/gh-sharedrepo/.github/workflows/deploy.yml@main
        with:
          environment: prod
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
